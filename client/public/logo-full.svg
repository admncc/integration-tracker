<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72">
  <!-- Mark plus company name, for documents and e-mails. The app draws its own. -->
  <defs>
    <linearGradient id="dmc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <mask id="dmc-cut">
      <path d="M20 18h14a18 18 0 0 1 0 36H20z" fill="#fff"/>
      <rect x="24.5" y="39" width="5" height="9" rx="1.5" fill="#000"/>
      <rect x="32" y="32.5" width="5" height="15.5" rx="1.5" fill="#000"/>
    </mask>
  </defs>
  <rect x="4" y="4" width="64" height="64" rx="15" fill="url(#dmc-bg)"/>
  <rect x="4" y="4" width="64" height="64" fill="#fff" mask="url(#dmc-cut)"/>
  <rect x="39.5" y="26" width="5" height="22" rx="1.5" fill="#f59e0b"/>
  <text x="86" y="44" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#101828" letter-spacing="-0.3">Digital Marketing Corp</text>
</svg>
